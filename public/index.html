          <button class="btn sm ghost" id="theme-toggle" aria-label="Toggle light or dark theme">Theme</button>

    <div class="row space-between mt">
      <button class="btn ghost" id="confirm-cancel">Cancel</button>
      <button class="btn danger" id="confirm-ok">Confirm</button>
    </div>
  </dialog>

  <script type="module" src="/app.js"></script>
